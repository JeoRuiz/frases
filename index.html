<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM+Plex Mono', monospace; background: #f4f4f4; color: #333; display: flex; justify-content: center; padding: 50px; }
        .container { max-width: 600px; }
        #frase-actual { font-size: 1.5rem; margin-bottom: 10px; }
        .autor { font-size: 0.9rem; color: #777; }
        hr { border: 0; border-top: 1px solid #ccc; margin: 40px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div id="frase-actual">Cargando sabiduría...</div>
        <div id="autor-actual" class="autor"></div>
        <hr>
        <h3>Archivo completo:</h3>
        <div id="lista-frases"></div>
    </div>

    <script>
       const API_URL = 'https://script.google.com/macros/s/AKfycbxgc8mXIJoFjadPfqdn7Pi3OF9gSNPC57a_ozMoVvfOT5kGP_-hJP-IaLLe0IBTzP4IBA/exec';

        async function cargarFrases() {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            // Mostrar todas las frases
            const lista = document.getElementById('lista-frases');
            data.forEach(item => {
                lista.innerHTML += `<p>"${item.frase}" — ${item.autor}</p>`;
            });

            // Lógica de hora
            const horaActual = new Date().getHours();
            const fraseDia = data.find(item => parseInt(item.hora) === horaActual) || data[0];
            
            document.getElementById('frase-actual').innerText = `"${fraseDia.frase}"`;
            document.getElementById('autor-actual').innerText = fraseDia.autor;
        }
        cargarFrases();
    </script>
</body>
</html>
